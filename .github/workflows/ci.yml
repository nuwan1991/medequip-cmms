name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medequip
          POSTGRES_PASSWORD: medequip
          POSTGRES_DB: medequip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medequip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medequip:medequip@localhost:5432/medequip?schema=public
      APP_DATABASE_URL: postgresql://medequip_app:medequip_app@localhost:5432/medequip?schema=public
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - name: Create restricted app role (as infra/postgres/init.sql does locally)
        run: psql postgresql://medequip:medequip@localhost:5432/medequip -c "CREATE ROLE medequip_app LOGIN PASSWORD 'medequip_app'"
      - name: Apply migrations and seed
        run: |
          pnpm db:deploy
          pnpm db:seed
      # Includes end-to-end API tests against the PostgreSQL service
      - run: pnpm test
